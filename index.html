<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinnerware Designer - Editor</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/dinnerware-dials.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Monospace numerals only; the theme manager loads the selected UI typeface -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="./dashboard.html" class="btn btn-icon" id="btnBackToDashboard" title="Back to Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                </a>
                <h1 class="app-title">Dinnerware Designer</h1>
            </div>
            <div class="header-center">
                <span class="project-name" id="projectName" contenteditable="plaintext-only" role="textbox" aria-label="Project name" title="Rename project" spellcheck="false">Untitled</span>
                <span class="unsaved-indicator" id="unsavedIndicator" hidden>•</span>
            </div>
            <div class="header-right">
                <button class="btn btn-icon btn-panel-toggle" id="btnTogglePanel" type="button" aria-expanded="false" aria-controls="parameterPanel" title="Parameters">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                    </svg>
                    <span class="visually-hidden">Parameters</span>
                </button>
                <div class="history-buttons" role="group" aria-label="History">
                    <button class="btn btn-icon" id="btnUndo" type="button" title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                        </svg>
                        <span class="btn-label">Undo</span>
                    </button>
                    <button class="btn btn-icon" id="btnRedo" type="button" title="Redo (⇧⌘Z / Ctrl+Y)" aria-label="Redo" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
                        </svg>
                        <span class="btn-label">Redo</span>
                    </button>
                </div>
                <button class="btn btn-secondary" id="btnNewProject">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    New
                </button>
                <button class="btn btn-secondary" id="btnLoadProject">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    Load
                </button>
                <button class="btn btn-secondary" id="btnSaveProject">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save
                </button>
                <button class="btn btn-primary" id="btnExportSTL">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export STL
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Parameter Panel -->
            <!-- Parameter controls: DialKit panels mounted by scripts/ui/dialkit/dinnerwareDials.js -->
            <aside class="parameter-panel dials-panel" id="parameterPanel" aria-label="Parameters"></aside>

            <!-- 3D Viewport -->
            <div class="viewport-container">
                <div class="viewport" id="viewport"></div>
                <section class="profile-panel" id="profilePanel" aria-label="Profile editor" hidden></section>
                <div class="selection-chip" id="selectionChip" hidden>
                    <span class="selection-name"></span>
                    <button type="button" class="selection-action" id="btnSelectionEdit">Edit overrides</button>
                    <button type="button" class="selection-clear" id="btnSelectionClear" aria-label="Clear selection">×</button>
                </div>
                <div class="viewport-overlay" id="viewportOverlay">
                    <div class="loading-spinner" id="loadingSpinner" hidden>
                        <div class="spinner"></div>
                        <span>Generating...</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">
                <div class="settings-menu-container" id="settingsMenuContainer">
                    <button class="btn-settings" id="btnSettings" title="Settings">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <div class="settings-menu" id="settingsMenu" data-no-ui-toggle>
                        <div class="settings-section">
                            <div class="settings-section-title">Appearance</div>
                            <button class="mode-toggle" id="btnModeToggle">
                                <span class="mode-toggle-label">
                                    <svg id="modeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="5"/>
                                        <line x1="12" y1="1" x2="12" y2="3"/>
                                        <line x1="12" y1="21" x2="12" y2="23"/>
                                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                        <line x1="1" y1="12" x2="3" y2="12"/>
                                        <line x1="21" y1="12" x2="23" y2="12"/>
                                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                                    </svg>
                                    <span>Light Mode</span>
                                </span>
                                <span class="mode-toggle-switch" id="modeToggle"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-center">
                <button class="btn btn-secondary btn-small" id="btnProfileView" type="button" aria-pressed="false" aria-controls="profilePanel" title="2D profile with draggable handles">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M4 20h16"/><path d="M6 20c1-6 2-12 3-15h6c1 3 2 9 3 15"/>
                    </svg>
                    Profile
                </button>
                <button class="btn btn-secondary btn-small" id="btnCompare" type="button" aria-pressed="false" title="Keep a ghost of the current design to compare against while you edit">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="5" width="12" height="14" rx="2"/><rect x="9" y="5" width="12" height="14" rx="2" stroke-dasharray="3 2"/>
                    </svg>
                    Compare
                </button>
            </div>
            <div class="footer-right">
                <span class="status-info" id="statusInfo">7 items</span>
                <div class="warnings-menu-container" id="warningsMenuContainer" hidden>
                    <button class="btn btn-warning-menu" id="btnWarningsMenu">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        <span id="warningCount">0 warnings</span>
                    </button>
                    <div class="warnings-menu" id="warningsMenu">
                        <div class="warnings-menu-header">
                            <span>Print checks</span>
                        </div>
                        <div class="warnings-menu-list" id="warningsList">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export STL Files</h2>
                <button class="btn-close" id="btnCloseExportModal">×</button>
            </div>
            <div class="modal-body">
                <div class="export-items">
                    <div class="export-header">
                        <span>Select items to export:</span>
                        <div class="export-actions">
                            <button class="btn btn-small" id="btnExportSelectAll">Select All</button>
                            <button class="btn btn-small" id="btnExportDeselectAll">Deselect All</button>
                        </div>
                    </div>
                    <div class="export-item-list" id="exportItemList">
                        <!-- Dynamically populated -->
                    </div>
                </div>
                <div class="export-options">
                    <label for="exportUpAxis">Orientation</label>
                    <select id="exportUpAxis">
                        <option value="z">Z-up: opens upright in slicers</option>
                        <option value="y">Y-up: for Cast Form and 3D tools</option>
                    </select>
                    <label class="export-zip">
                        <input type="checkbox" id="exportAsZip" checked>
                        Download as one ZIP
                    </label>
                </div>
                <p class="export-error" id="exportError" role="alert" hidden></p>
                <div class="export-progress" id="exportProgress" hidden>
                    <div class="progress-bar">
                        <div class="progress-fill" id="exportProgressFill"></div>
                    </div>
                    <span class="progress-text" id="exportProgressText">Exporting...</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelExport">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmExport">Export</button>
            </div>
        </div>
    </div>

    <!-- Save Project Modal -->
    <div class="modal" id="saveModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Save Project</h2>
                <button class="btn-close" id="btnCloseSaveModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="saveProjectName">Project Name</label>
                    <input type="text" id="saveProjectName" placeholder="Enter project name" value="Untitled">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="saveAsFile">
                        <span>Also save as file (.json)</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelSave">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
                <button class="btn-close" id="btnCloseConfirmModal">×</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">Are you sure?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnConfirmCancel">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmOk">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/ui/pageComments/pageComments.js"></script>
</body>
</html>
