<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Apply the remembered parameters visibility before first paint -->
    <script>try{if(localStorage.getItem('dinnerware_dials_visible')==='0')document.documentElement.classList.add('params-hidden');}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinnerware Designer - Editor</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/dinnerware-dials.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Monospace numerals only; the theme manager loads the selected UI typeface -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header (DialKit-styled toolbar) -->
        <header class="header dk-header">
            <div class="header-left">
                <a href="./dashboard.html" class="dk-icon-btn" id="btnBackToDashboard" title="Back to Dashboard" aria-label="Back to Dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
                    </svg>
                </a>
                <h1 class="app-title">Dinnerware Designer</h1>
            </div>
            <div class="header-center">
                <span class="project-name" id="projectName" contenteditable="plaintext-only" role="textbox" aria-label="Project name" title="Rename project" spellcheck="false">Untitled</span>
                <span class="unsaved-indicator" id="unsavedIndicator" hidden>•</span>
            </div>
            <div class="header-right">
                <div class="dk-group" role="group" aria-label="History">
                    <button class="dk-icon-btn" id="btnUndo" type="button" title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                        </svg>
                    </button>
                    <button class="dk-icon-btn" id="btnRedo" type="button" title="Redo (⇧⌘Z / Ctrl+Y)" aria-label="Redo" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
                        </svg>
                    </button>
                </div>
                <div class="dk-menu" id="fileMenu">
                    <button class="dk-btn" id="btnFileMenu" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenuList">
                        File
                        <svg class="dk-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="dk-menu-list" id="fileMenuList" role="menu" aria-labelledby="btnFileMenu" hidden>
                        <button class="dk-menu-item" id="btnNewProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
                            </svg>
                            <span>New</span>
                        </button>
                        <button class="dk-menu-item" id="btnLoadProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>Load…</span>
                        </button>
                        <button class="dk-menu-item" id="btnSaveProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
                            </svg>
                            <span>Save…</span>
                        </button>
                        <div class="dk-menu-divider" role="separator"></div>
                        <button class="dk-menu-item" id="btnExportSTL" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span>Export STL…</span>
                        </button>
                    </div>
                </div>
                <button class="dk-icon-btn" id="btnTogglePanel" type="button" aria-pressed="true" aria-controls="parameterPanel" title="Hide parameters" aria-label="Parameters">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="15" y1="4" x2="15" y2="20"/>
                        <rect class="dk-panel-fill" x="15" y="4" width="6" height="16" fill="currentColor" stroke="none"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Parameter Panel -->
            <!-- Parameter controls: DialKit panels mounted by scripts/ui/dialkit/dinnerwareDials.js -->
            <aside class="parameter-panel dials-panel" id="parameterPanel" aria-label="Parameters"></aside>

            <!-- 3D Viewport -->
            <div class="viewport-container">
                <div class="viewport" id="viewport"></div>
                <div class="selection-chip" id="selectionChip" hidden>
                    <span class="selection-name"></span>
                    <button type="button" class="selection-action" id="btnSelectionEdit">Edit overrides</button>
                    <button type="button" class="selection-clear" id="btnSelectionClear" aria-label="Clear selection">×</button>
                </div>
                <div class="viewport-overlay" id="viewportOverlay">
                    <div class="loading-spinner" id="loadingSpinner" hidden>
                        <div class="spinner"></div>
                        <span>Generating...</span>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export STL Files</h2>
                <button class="btn-close" id="btnCloseExportModal">×</button>
            </div>
            <div class="modal-body">
                <div class="export-items">
                    <div class="export-header">
                        <span>Select items to export:</span>
                        <div class="export-actions">
                            <button class="btn btn-small" id="btnExportSelectAll">Select All</button>
                            <button class="btn btn-small" id="btnExportDeselectAll">Deselect All</button>
                        </div>
                    </div>
                    <div class="export-item-list" id="exportItemList">
                        <!-- Dynamically populated -->
                    </div>
                </div>
                <div class="export-options">
                    <label for="exportUpAxis">Orientation</label>
                    <select id="exportUpAxis">
                        <option value="z">Z-up: opens upright in slicers</option>
                        <option value="y">Y-up: for Cast Form and 3D tools</option>
                    </select>
                    <label class="export-zip">
                        <input type="checkbox" id="exportAsZip" checked>
                        Download as one ZIP
                    </label>
                </div>
                <p class="export-error" id="exportError" role="alert" hidden></p>
                <div class="export-progress" id="exportProgress" hidden>
                    <div class="progress-bar">
                        <div class="progress-fill" id="exportProgressFill"></div>
                    </div>
                    <span class="progress-text" id="exportProgressText">Exporting...</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelExport">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmExport">Export</button>
            </div>
        </div>
    </div>

    <!-- Save Project Modal -->
    <div class="modal" id="saveModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Save Project</h2>
                <button class="btn-close" id="btnCloseSaveModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="saveProjectName">Project Name</label>
                    <input type="text" id="saveProjectName" placeholder="Enter project name" value="Untitled">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="saveAsFile">
                        <span>Also save as file (.json)</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelSave">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
                <button class="btn-close" id="btnCloseConfirmModal">×</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">Are you sure?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnConfirmCancel">Cancel</button>
                <button class="btn btn-primary" id="btnConfirmOk">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/ui/pageComments/pageComments.js"></script>
</body>
</html>
