<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Vessel V3 is retired (2026-10-21): send anyone who lands here back to the dashboard.
         The code and saved projects are kept; delete this line to restore access. -->
    <script>location.replace('../dashboard.html');</script>
    <!-- Apply the remembered parameters visibility before first paint -->
    <script>try{if(localStorage.getItem('vessel_v3_dials_visible')==='0')document.documentElement.classList.add('params-hidden');}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Designer V3</title>
    <link rel="stylesheet" href="../styles/vessel-v3-generator.css">
    <link rel="stylesheet" href="../styles/dialkit-chrome.css">
    <link rel="stylesheet" href="../styles/vessel-v3-dials.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Monospace numerals only; the theme manager loads the selected UI typeface -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header (DialKit-styled toolbar) -->
        <header class="header dk-header">
            <div class="header-left">
                <a href="../dashboard.html" class="dk-icon-btn" id="btnBackToDashboard" title="Back to Dashboard" aria-label="Back to Dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
                    </svg>
                </a>
                <h1 class="app-title">Vessel Designer V3</h1>
            </div>
            <div class="header-center">
                <span class="project-name" id="projectName" contenteditable="plaintext-only" role="textbox" aria-label="Project name" title="Rename project" spellcheck="false">Untitled Vessel V3</span>
                <span class="unsaved-indicator" id="unsavedIndicator" hidden>•</span>
            </div>
            <div class="header-right">
                <div class="dk-group" role="group" aria-label="History">
                    <button class="dk-icon-btn" id="btnUndo" type="button" title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                        </svg>
                    </button>
                    <button class="dk-icon-btn" id="btnRedo" type="button" title="Redo (⇧⌘Z / Ctrl+Y)" aria-label="Redo" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
                        </svg>
                    </button>
                </div>
                <div class="dk-menu" id="fileMenu">
                    <button class="dk-btn" id="btnFileMenu" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenuList">
                        File
                        <svg class="dk-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="dk-menu-list" id="fileMenuList" role="menu" aria-labelledby="btnFileMenu" hidden>
                        <button class="dk-menu-item" id="btnNewProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
                            </svg>
                            <span>New</span>
                        </button>
                        <button class="dk-menu-item" id="btnLoadProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>Load…</span>
                        </button>
                        <button class="dk-menu-item" id="btnSaveProject" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
                            </svg>
                            <span>Save…</span>
                        </button>
                        <div class="dk-menu-divider" role="separator"></div>
                        <button class="dk-menu-item" id="btnExportSTL" type="button" role="menuitem">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span>Export Vessel STL</span>
                        </button>
                        <!-- Shown while the lid is enabled (vesselV3Main.js syncUIFromState) -->
                        <button class="dk-menu-item" id="btnExportLidSTL" type="button" hidden>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span>Export Lid STL</span>
                        </button>
                    </div>
                </div>
                <button class="dk-icon-btn dk-panel-toggle" id="btnTogglePanel" type="button" aria-pressed="true" aria-controls="parameterPanel" title="Hide parameters" aria-label="Parameters">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="15" y1="4" x2="15" y2="20"/>
                        <rect class="dk-panel-fill" x="15" y="4" width="6" height="16" fill="currentColor" stroke="none"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Freeform profile editor (scripts/vesselV3/ui/profileEditor.js) -->
            <section class="profile-workspace" id="profileEditor" aria-label="Profile editor">
                <div class="profile-toolbar" role="toolbar" aria-label="Profile tools">
                    <div class="dk-group" role="group" aria-label="Tool">
                        <button class="dk-icon-btn" type="button" data-tool="pen" title="Pen (P)" aria-label="Pen">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/>
                            </svg>
                        </button>
                        <button class="dk-icon-btn" type="button" data-tool="edit" title="Edit (V)" aria-label="Edit">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 3l7.5 18 2.6-7.9L21 10.5 3 3z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="dk-group" role="group" aria-label="Profile zoom controls">
                        <button class="dk-icon-btn" id="btnProfileZoomOut" type="button" title="Zoom out" aria-label="Zoom out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </button>
                        <span class="zoom-value" id="profileZoomValue" aria-live="polite">100%</span>
                        <button class="dk-icon-btn" id="btnProfileZoomIn" type="button" title="Zoom in" aria-label="Zoom in">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </button>
                        <button class="dk-icon-btn" id="btnProfileFit" type="button" title="Fit profile" aria-label="Fit profile">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                            </svg>
                        </button>
                        <button class="dk-icon-btn" id="btnProfilePan" type="button" title="Pan profile (hold Space)" aria-label="Pan profile">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M18 11.5V10a2 2 0 0 0-4 0v1"/><path d="M14 10V8a2 2 0 0 0-4 0v4"/><path d="M10 10.5V9a2 2 0 0 0-4 0v5"/><path d="M18 11.5a2 2 0 1 1 4 0V15a7 7 0 0 1-7 7h-3.5a7 7 0 0 1-5.6-2.8L3 15.4a2 2 0 0 1 3-2.6L8 15"/>
                            </svg>
                        </button>
                    </div>
                    <button class="dk-icon-btn dk-icon-btn-danger" id="btnDeletePoint" type="button" title="Delete point (Delete)" aria-label="Delete point">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                        </svg>
                    </button>
                </div>

                <div class="profile-canvas-wrap">
                    <svg id="profileSvg" class="profile-svg" role="img" aria-label="Vessel profile editor"></svg>
                </div>

                <div class="profile-stats">
                    <span>Height <strong id="profileHeight">0 mm</strong></span>
                    <span>Diameter <strong id="profileDiameter">0 mm</strong></span>
                    <span>Points <strong id="profilePointCount">0</strong></span>
                </div>

                <!-- Unwrapped preview of the Surface Motif panel's segment -->
                <div class="motif-strip" id="motifStrip" hidden>
                    <div class="motif-strip-cap"><span data-motif-caption>Motif</span><span>unwrapped</span></div>
                    <canvas id="motifPreview" width="270" height="56"></canvas>
                    <p class="motif-strip-warning" data-motif-warning role="status" hidden></p>
                </div>

                <div class="profile-warnings" id="profileWarnings" aria-live="polite"></div>
            </section>

            <section class="viewport-shell">
                <div class="viewport" id="viewport"></div>
            </section>

            <!-- Parameter controls: DialKit panels mounted by scripts/ui/dialkit/vesselV3Dials.js -->
            <aside class="dk-dials-card" id="parameterPanel" aria-label="Parameters"></aside>
        </main>
    </div>

    <!-- Dialogs: DialKit-styled cards (styles/dialkit-chrome.css) -->
    <div class="modal dk-modal" id="saveModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Save Project</h2>
                <button class="dk-icon-btn btn-close" id="btnCloseSaveModal" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <label class="dk-row dk-text-row" for="saveProjectName">
                    <span class="dk-row-label">Name</span>
                    <input type="text" id="saveProjectName" placeholder="Project name" value="Untitled Vessel V3">
                </label>
                <div class="dk-row dk-toggle-row">
                    <label class="dk-row-label" for="saveAsFile">Also Save as File (.json)</label>
                    <span class="dk-segmented">
                        <input type="checkbox" id="saveAsFile">
                        <span class="dk-seg dk-seg-off" aria-hidden="true">Off</span>
                        <span class="dk-seg dk-seg-on" aria-hidden="true">On</span>
                    </span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="dk-btn" id="btnCancelSave" type="button">Cancel</button>
                <button class="dk-btn dk-btn-primary" id="btnConfirmSave" type="button">Save</button>
            </div>
        </div>
    </div>

    <div class="modal dk-modal" id="confirmModal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
                <button class="dk-icon-btn btn-close" id="btnCloseConfirmModal" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">Are you sure?</p>
            </div>
            <div class="modal-footer">
                <button class="dk-btn" id="btnConfirmCancel" type="button">Cancel</button>
                <button class="dk-btn dk-btn-primary" id="btnConfirmOk" type="button">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/vesselV3/vesselV3Main.js"></script>
</body>
</html>
