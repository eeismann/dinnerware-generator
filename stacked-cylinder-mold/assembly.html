<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Cylinder Mold · Assembly guide (Braz mug)</title>
<style>
  :root { --paper: #f5f3ee; --ink: #141414; --muted: #6d6a63; --rule: #d6d2c8; --card: #fbfaf7;
    --kit: #6f8fa6; --ware: #c8402a; --hw: #5d6168; --plaster: #c9b98f; --ghost: #8fb3c9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid; grid-template-columns: 380px 1fr; overflow: hidden; }
  aside { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 22px 22px 14px; border-bottom: 1px solid var(--rule); }
  h1 { font-size: 21px; font-weight: 500; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 22px 4px; }
  .tabs button { font: inherit; font-size: 12.5px; border: 1px solid var(--ink); background: transparent; padding: 5px 10px; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--paper); }
  ol.steps { list-style: none; overflow-y: auto; padding: 10px 14px 10px 22px; flex: 1; counter-reset: s; }
  ol.steps li { counter-increment: s; }
  ol.steps button { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; column-gap: 8px; width: 100%;
    text-align: left; font: inherit; background: none; border: 0; border-left: 2px solid transparent; padding: 8px 8px 8px 6px; cursor: pointer; color: var(--muted); }
  ol.steps button::before { content: counter(s); grid-row: 1 / 3; font-size: 12px; font-weight: 600; width: 22px; height: 22px;
    border: 1px solid var(--rule); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  ol.steps b { font-weight: 600; color: var(--ink); font-size: 13px; }
  ol.steps span { font-size: 12.5px; }
  ol.steps li.on button { border-left-color: var(--ware); background: var(--card); color: #3a3833; }
  ol.steps li.on button::before { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav { display: flex; gap: 8px; padding: 12px 22px 18px; border-top: 1px solid var(--rule); align-items: center; }
  .nav button { font: inherit; font-size: 13px; padding: 7px 14px; border: 1px solid var(--ink); background: transparent; cursor: pointer; }
  .nav button.primary { background: var(--ink); color: var(--paper); margin-left: auto; }
  .nav button:disabled { opacity: .35; cursor: default; }
  main { position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; }
  .caption { position: absolute; left: 20px; right: 20px; bottom: 18px; max-width: 760px; margin: 0 auto; background: rgba(251,250,247,.95);
    border: 1px solid var(--rule); padding: 12px 16px; font-size: 14px; color: #3a3833; }
  .caption b { color: var(--ink); margin-right: 6px; }
  .topbar { position: absolute; left: 20px; top: 16px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  #stepTitle { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); background: rgba(245,243,238,.9); padding: 4px 8px; }
  .legend { list-style: none; background: rgba(251,250,247,.95); border: 1px solid var(--rule); padding: 8px 12px; font-size: 12px; min-width: 170px; }
  .legend li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .legend li::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: var(--kit); }
  .legend li.t-ware::before { background: #d9907a; } .legend li.t-hw::before { background: var(--hw); }
  .legend li.t-plaster::before { background: #e9dfc4; border: 1px solid #c9b98f; } .legend li.t-ghost::before { background: var(--ghost); }
  #section { font: inherit; font-size: 12px; border: 1px solid var(--rule); background: rgba(251,250,247,.95); padding: 5px 9px; cursor: pointer; margin-top: 8px; display: block; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
  .tiers { padding: 0 22px 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
    main { grid-row: 1; border-bottom: 1px solid var(--rule); }
    aside { grid-row: 2; border-right: 0; }
    header { padding: 12px 16px 8px; } .sub { display: none; }
    .tabs { padding: 8px 16px 2px; } .tiers { padding: 0 16px 6px; }
    .legend { display: none; } #section { margin-top: 0; }
    .caption { left: 10px; right: 10px; bottom: 10px; padding: 8px 12px; font-size: 13px; }
    .topbar { left: 10px; top: 10px; }
  }
  .tiers i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Assembling the mold kit</h1>
    <p class="sub">Braz mug in the Ø175 universal kit (sleeve 150 mm), Bambu H2S. Every part shown is the generator's real geometry.</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="tiers"><span><i style="background:#9fb3c4"></i>Kit, print once</span><span><i style="background:#d9907a"></i>Mug's own parts</span><span><i style="background:#5d6168"></i>Hardware</span><span><i style="background:#e9dfc4;border:1px solid #c9b98f"></i>Plaster</span></div>
  <ol class="steps" id="steps"></ol>
  <div class="nav">
    <button type="button" id="prev">← Back</button>
    <span class="sub">or use ← →</span>
    <button type="button" id="next" class="primary">Next →</button>
  </div>
</aside>
<main>
  <div id="view"></div>
  <div class="topbar">
    <span id="stepTitle"></span>
    <div><ul class="legend" id="legend"></ul><button type="button" id="section">Section: quarter cut</button></div>
  </div>
  <div class="caption" id="caption"></div>
  <div id="status">Loading…</div>
</main>
<script type="module">
  import { mountAssemblyGuide } from '/scripts/stackedMold/ui/assemblyGuide.js';
  const $ = id => document.getElementById(id);
  mountAssemblyGuide({
    canvasHost: $('view'), stepsEl: $('steps'), tabsEl: $('tabs'), titleEl: $('stepTitle'), captionEl: $('caption'),
    prevBtn: $('prev'), nextBtn: $('next'), sectionBtn: $('section'), legendEl: $('legend'), statusEl: $('status'),
    stlUrl: '/test-files/stacked-mold/braz-set/Braz_3_mug.stl', wareName: 'Braz mug',
    kit: { diameter: 175, sleeveH: 150 }
  }).catch(err => { $('status').textContent = 'Could not build the guide: ' + err.message; console.error(err); });
</script>
</body>
</html>
